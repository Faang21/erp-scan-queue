<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINCE AI — Google Gemini Style Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Outfit & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Marked.js for Markdown & Highlight.js for Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #0e1017;
      --bg-sidebar: #13151f;
      --bg-input: #1e202e;
      --bg-card: rgba(255, 255, 255, 0.04);
      --accent-cyan: #00dfd8;
      --accent-purple: #7928ca;
      --accent-pink: #ff0080;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* GOOGLE GEMINI STYLE SIDEBAR */
    .gemini-sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .gemini-sidebar.collapsed {
      width: 70px;
    }

    .gemini-sidebar.collapsed .sidebar-text,
    .gemini-sidebar.collapsed .recents-section,
    .gemini-sidebar.collapsed .user-info {
      display: none !important;
    }

    .sidebar-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      background: linear-gradient(135deg, #00dfd8 0%, #7928ca 50%, #ff0080 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .sidebar-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .sidebar-toggle-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-new-chat {
      margin: 10px 16px;
      padding: 12px 18px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn-new-chat:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-cyan);
    }

    .sidebar-menu {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-item {
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      font-size: 0.93rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .sidebar-item:hover, .sidebar-item.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* RECENTS CHAT LIST */
    .recents-section {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .recents-section::-webkit-scrollbar { width: 4px; }
    .recents-section::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

    .recents-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-uppercase;
      color: var(--text-muted);
      margin: 12px 6px 6px 6px;
      letter-spacing: 0.5px;
    }

    .recent-chat-item {
      padding: 8px 12px;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.86rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }

    .recent-chat-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .recent-chat-item.active {
      background: rgba(0, 223, 216, 0.15);
      color: var(--accent-cyan);
      border-left: 3px solid var(--accent-cyan);
      font-weight: 600;
    }

    .recent-chat-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }

    .recent-chat-del-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.4;
      transition: all 0.2s;
    }

    .recent-chat-item:hover .recent-chat-del-btn {
      opacity: 1;
    }

    .recent-chat-del-btn:hover {
      color: #ff4d4d;
      background: rgba(255, 77, 77, 0.18);
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
    }

    /* MAIN CHAT AREA */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .chat-stream-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
    }

    .chat-stream-container::-webkit-scrollbar { width: 6px; }
    .chat-stream-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    /* CENTER GEMINI HERO TITLE */
    .hero-center {
      margin: auto 0;
      text-align: center;
      padding: 20px;
    }

    .hero-center-title {
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 28px;
    }

    /* GEMINI FLOATING INPUT BAR */
    .gemini-input-container {
      max-width: 850px;
      margin: 0 auto 30px auto;
      width: 100%;
      padding: 0 20px;
    }

    .gemini-input-box {
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      transition: all 0.25s;
    }

    .gemini-input-box:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 12px 45px rgba(0, 223, 216, 0.25);
    }

    .gemini-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.05rem;
      outline: none;
    }

    .model-selector-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--accent-cyan);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .input-action-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-send-gemini {
      background: linear-gradient(135deg, #7928ca 0%, #00dfd8 100%);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(121, 40, 202, 0.45);
    }

    /* BUBBLE CHAT STYLES */
    .msg-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }

    .msg-avatar.ai {
      background: linear-gradient(135deg, #7928ca 0%, #00dfd8 100%);
      color: #fff;
    }

    .msg-avatar.user img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 18px 24px;
      border-radius: 20px;
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .msg-row.ai .msg-bubble {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top-left-radius: 4px;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .msg-bubble pre {
      background: #161824;
      border-radius: 12px;
      padding: 16px;
      overflow-x: auto;
      margin: 14px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* VOICE STATUS INDICATOR BANNER */
    .voice-status-indicator {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      margin: 0 auto 10px auto;
      width: fit-content;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.25);
      pointer-events: auto;
      animation: pulse 1.5s infinite;
    }

    /* MEDIA PREVIEW */
    .media-preview-area {
      display: flex;
      gap: 10px;
      padding: 8px 20px;
      max-width: 850px;
      margin: 0 auto;
    }
    .media-preview-item {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .media-preview-item img, .media-preview-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* MOBILE NATIVE RESPONSIVE UI STYLES (max-width: 768px) */
    .mobile-header {
      display: none;
    }
    .mobile-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1040;
    }

    @media (max-width: 768px) {
      html, body {
        height: 100dvh !important;
        overflow: hidden !important;
        position: fixed;
        width: 100%;
      }

      body {
        flex-direction: column;
      }

      .mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: var(--bg-sidebar);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 1020;
        position: sticky;
        top: 0;
        flex-shrink: 0;
      }

      .gemini-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        height: 100dvh;
        width: 280px !important;
        z-index: 1050;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 4px 0 25px rgba(0, 0, 0, 0.6);
      }

      .gemini-sidebar.mobile-open {
        transform: translateX(0) !important;
      }

      .gemini-sidebar .sidebar-text,
      .gemini-sidebar .recents-section,
      .gemini-sidebar .user-info {
        display: flex !important;
      }

      .gemini-sidebar.collapsed {
        width: 280px !important;
      }

      .mobile-overlay.active {
        display: block;
      }

      .main-wrapper {
        height: calc(100dvh - 53px);
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      .chat-stream-container {
        padding: 14px 10px 150px 10px !important;
        gap: 14px;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
        overscroll-behavior-y: contain;
        max-height: 100%;
      }

      .hero-center-title {
        font-size: 1.75rem;
        margin-bottom: 16px;
      }

      .gemini-input-container {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0 8px 10px 8px;
        margin-bottom: 0;
        background: linear-gradient(180deg, rgba(13, 14, 21, 0) 0%, var(--bg-dark) 55%);
        z-index: 10;
        pointer-events: none;
      }

      .gemini-input-box, #imageStudioTools {
        pointer-events: auto;
      }

      .gemini-input-box {
        padding: 8px 12px;
        border-radius: 24px;
        gap: 8px;
      }

      .gemini-input {
        font-size: 0.95rem;
      }

      .model-selector-badge span {
        display: none;
      }

      .btn-send-gemini {
        width: 36px;
        height: 36px;
      }

      .msg-bubble {
        max-width: 92%;
        padding: 12px 14px;
        font-size: 0.92rem;
      }

      .msg-avatar {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
      }

      #imageStudioTools button {
        font-size: 0.75rem;
        padding: 4px 10px;
      }
    }
  </style>
</head>
<body>

  <!-- MOBILE BACKDROP OVERLAY -->
  <div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileSidebar()"></div>

  <!-- GOOGLE GEMINI SIDEBAR -->
  <aside class="gemini-sidebar" id="geminiSidebar">
    <div>
      <div class="sidebar-header">
        <a href="#" class="sidebar-brand">
          <i class="fa-solid fa-crown text-warning"></i> <span class="sidebar-text">PRINCE AI</span>
        </a>
        <button class="sidebar-toggle-btn" title="Toggle Sidebar" onclick="toggleSidebar()">
          <i class="bi bi-layout-sidebar-inset"></i>
        </button>
      </div>

      <div class="btn-new-chat" onclick="startNewChat()">
        <i class="bi bi-plus-lg"></i>
        <span class="sidebar-text">New chat</span>
      </div>

      <div class="sidebar-menu">
        <a href="#" class="sidebar-item active" id="tabChats" onclick="selectTab('chats')">
          <i class="bi bi-chat-dots-fill"></i>
          <span class="sidebar-text">Chats</span>
        </a>
        <a href="#" class="sidebar-item" id="tabImages" onclick="selectTab('images')">
          <i class="bi bi-image-fill"></i>
          <span class="sidebar-text">Images</span>
        </a>
        <a href="#" class="sidebar-item" id="tabVideos" onclick="selectTab('videos')">
          <i class="bi bi-film"></i>
          <span class="sidebar-text">Videos</span>
        </a>
        <a href="#" class="sidebar-item" onclick="alert('Mogaworld ERP Dashboard Integrated')">
          <i class="bi bi-grid-fill"></i>
          <span class="sidebar-text">ERP Dashboard</span>
        </a>
      </div>

      <!-- RECENTS LIST WITH CLEAR BUTTON -->
      <div class="recents-section">
        <div class="d-flex align-items-center justify-content-between recents-title pe-2">
          <span>Recents</span>
          <button class="btn btn-link text-danger text-decoration-none p-0" style="font-size: 10px;" onclick="clearChatHistory()" title="Hapus Riwayat Chat">
            <i class="bi bi-trash3-fill"></i> Hapus
          </button>
        </div>
        <div id="recentsChatList"></div>
      </div>
    </div>

    <!-- SIDEBAR FOOTER (USER PROFILE & GOOGLE DRIVE 5.39TB LINK) -->
    <div class="sidebar-footer">
      <div class="user-badge" onclick="openProfileModal()">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aang" alt="Avatar" class="user-avatar" id="sidebarAvatarImg">
        <div class="user-info" style="line-height: 1.2;">
          <div class="fw-bold text-white small" id="sidebarUserName">Aang Crypto</div>
          <a href="https://drive.google.com/drive/project/1aaGCAnqWGTC7jkzXmE8r97-Erp0k0giu?hl=ID" target="_blank" class="text-info text-decoration-none" style="font-size: 10px;">
            <i class="bi bi-cloud-check-fill text-success"></i> Drive 5.39 TB
          </a>
          <div id="userLocationBadge" class="text-cyan font-monospace mt-1" style="font-size: 10px; cursor: pointer;" onclick="promptLocationChange()" title="Klik untuk Ubah Lokasi Manual atau Reset ke GPS Otomatis">
            <i class="bi bi-geo-alt-fill text-danger me-1"></i> Mendeteksi Lokasi...
          </div>
        </div>
      </div>
      <button class="sidebar-toggle-btn text-secondary" title="Settings / Login" onclick="openAuthModal('login')">
        <i class="bi bi-gear-fill"></i>
      </button>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main class="main-wrapper">

    <!-- MOBILE TOP BAR HEADER -->
    <header class="mobile-header">
      <button class="sidebar-toggle-btn text-white" onclick="toggleMobileSidebar()" title="Buka Menu Sidebar">
        <i class="bi bi-list fs-3"></i>
      </button>
      <div class="sidebar-brand text-decoration-none" style="font-size: 1.2rem;">
        <i class="fa-solid fa-crown text-warning"></i> <span>PRINCE AI</span>
      </div>
      <button class="sidebar-toggle-btn text-cyan" onclick="startNewChat()" title="Chat Baru">
        <i class="bi bi-plus-lg fs-4"></i>
      </button>
    </header>
    
    <!-- CHAT STREAM CONTAINER -->
    <div class="chat-stream-container" id="chatStream">
      <div class="hero-center" id="heroCenter">
        <h1 class="hero-center-title" id="heroTitle">What can I help with, Aang?</h1>
      </div>
    </div>

    <!-- MEDIA PREVIEW -->
    <div id="mediaPreviewArea" class="media-preview-area d-none"></div>

    <!-- GEMINI FLOATING INPUT BAR -->
    <div class="gemini-input-container">
      
      <!-- VOICE RECORDING STATUS BANNER -->
      <div id="voiceStatusIndicator" class="voice-status-indicator d-none">
        <i class="bi bi-mic-fill text-danger me-2"></i> <span id="voiceStatusText">Mendengarkan suara...</span>
      </div>

      <!-- IMAGE STUDIO QUICK TOOLBAR (ONLY VISIBLE IN IMAGES TAB OR WHEN ATTACHING MEDIA) -->
      <div id="imageStudioTools" class="d-none flex-wrap align-items-center justify-content-center gap-2 mb-3">
        <button class="btn btn-sm btn-outline-info rounded-pill px-3 shadow-sm" onclick="triggerImageStudio('generate')" title="Generasi Gambar AI (Text-to-Image / FLUX Cloud)">
          <i class="bi bi-magic me-1"></i> 🎨 Generate AI Foto
        </button>
        <button class="btn btn-sm btn-outline-warning rounded-pill px-3 shadow-sm" onclick="triggerImageStudio('remove_bg')" title="Hapus Background Foto Otomatis">
          <i class="bi bi-scissors me-1"></i> ✂️ Hapus Background
        </button>
        <button class="btn btn-sm btn-outline-success rounded-pill px-3 shadow-sm" onclick="triggerImageStudio('change_bg')" title="Ganti Background Foto dengan Latar Baru">
          <i class="bi bi-image me-1"></i> 🌄 Ganti Background
        </button>
        <button class="btn btn-sm rounded-pill px-3 text-white shadow-sm" style="background: linear-gradient(135deg, #7928ca 0%, #ff0080 100%); border: none;" onclick="triggerImageStudio('cartoon_3d')" title="Ubah Foto / Karakter ke Kartun 3D Disney/Pixar">
          <i class="bi bi-person-workspace me-1"></i> 🎭 Kartun 3D Pixar
        </button>
      </div>

      <div class="gemini-input-box">
        <input type="file" id="fileInput" accept="image/*,video/*" class="d-none" onchange="handleFileSelect(event)">
        <button class="input-action-btn" title="Upload Media" onclick="document.getElementById('fileInput').click()">
          <i class="bi bi-plus-lg"></i>
        </button>

        <input type="text" class="gemini-input" id="userInput" placeholder="Ask Prince AI..." onkeydown="handleKeyPress(event)" autocomplete="off">

    function initUserLocation() {
      const savedManual = localStorage.getItem('prince_manual_location');
      if (savedManual) {
        userLocation.city = savedManual;
        userLocation.displayLocation = `${savedManual} (Lokasi Kustom)`;

        return;

      detectUserLocation();
    }

    function detectUserLocation() {
      if (userLocation.isManual) return updateUserLocationUI();

      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            userLocation.lat = lat;
            userLocation.lon = lon;

            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
              if (res.ok) {
                const data = await res.json();
                const addr = data.address || {};
                const subdistrict = addr.subdistrict || addr.district || addr.suburb || addr.quarter || addr.village || '';
                const city = addr.city || addr.town || addr.municipality || addr.regency || addr.county || addr.city_district || '';
                const state = addr.state || '';
                const country = addr.country || 'Indonesia';

                const locParts = [subdistrict, city, state, country].filter(Boolean);
                const fullLocStr = locParts.join(', ');

                userLocation.city = city ? (subdistrict ? `${subdistrict}, ${city}` : city) : (subdistrict || state || 'Indonesia');
                userLocation.country = country;
                userLocation.displayLocation = `${fullLocStr} (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
              } else {
                userLocation.city = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
                userLocation.displayLocation = userLocation.city;
              }
            } catch(e) {
              console.warn('Reverse geocode error:', e);
              userLocation.city = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
              userLocation.displayLocation = userLocation.city;
            }
            updateUserLocationUI();
          },
          (err) => {
            console.warn('GPS permission denied or timeout:', err);
            fetchIPLocationFallback();
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
        );
      } else {
        fetchIPLocationFallback();
      }
    }

    async function fetchIPLocationFallback() {
      if (userLocation.isManual) return updateUserLocationUI();

      try {
        const res1 = await fetch('https://ipwho.is/');
        if (res1.ok) {
          const data1 = await res1.json();
          if (data1.success && data1.city) {
            const district = data1.region || '';
            userLocation.city = `${data1.city}${district ? ', ' + district : ''}`;
            userLocation.country = data1.country || 'Indonesia';
            userLocation.displayLocation = `${data1.city}, ${district}, ${data1.country || 'Indonesia'}`;
            return updateUserLocationUI();
          }
        }
      } catch(e) {}

      try {
        const res2 = await fetch('https://ipapi.co/json/');
        if (res2.ok) {
          const data2 = await res2.json();
          if (data2.city) {
            userLocation.city = `${data2.city}, ${data2.region || ''}`;
            userLocation.country = data2.country_name || 'Indonesia';
            userLocation.displayLocation = `${data2.city}, ${data2.region || ''}, ${data2.country_name || 'Indonesia'}`;
            return updateUserLocationUI();
          }
        }
      } catch(e) {}

      updateUserLocationUI();
    }

    function promptLocationChange() {

    function getLiveSystemTimeString() {
      const now = new Date();
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const dayName = days[now.getDay()];
      const monthName = months[now.getMonth()];
      const dateNum = now.getDate();
      const yearNum = now.getFullYear();
      const hoursStr = String(now.getHours()).padStart(2, '0');
      const minsStr = String(now.getMinutes()).padStart(2, '0');
      const secsStr = String(now.getSeconds()).padStart(2, '0');

      const fullDate = `${dayName}, ${dateNum} ${monthName} ${yearNum}`;
      const fullTime = `${hoursStr}:${minsStr}:${secsStr} WIB`;
      return { fullDate, fullTime, dateTimeString: `${fullDate} (Pukul ${fullTime})` };
    }

    }

    function loadHistoryToUI() {
      const sessionsKey = `prince_chat_sessions_${currentUser.email}`;
      const currentIdKey = `prince_current_session_id_${currentUser.email}`;

      try {
        const savedSessions = localStorage.getItem(sessionsKey);
        if (savedSessions) {
          chatSessions = JSON.parse(savedSessions);
        }
      } catch(e) {
        console.warn('Failed to parse chat sessions from localStorage:', e);
        chatSessions = [];
      }

      // Backward compatibility migration for old single chatHistory
      if (!Array.isArray(chatSessions) || chatSessions.length === 0) {
        const oldHistoryKey = `prince_chat_history_${currentUser.email}`;
        try {
          const oldHist = localStorage.getItem(oldHistoryKey);
          if (oldHist) {
            const parsedOld = JSON.parse(oldHist);
            if (Array.isArray(parsedOld) && parsedOld.length > 1) {
              const firstUserMsg = parsedOld.find(m => m.role === 'user');
              const title = firstUserMsg ? (typeof firstUserMsg.content === 'string' ? firstUserMsg.content.slice(0, 28) : 'Percakapan Sebelumnya') : 'Percakapan Sebelumnya';
              chatSessions = [{
                id: 'sess_' + Date.now(),
                title: title,
                updatedAt: Date.now(),
                messages: parsedOld
              }];
            }
          }
        } catch(e) {}
      }

      if (!Array.isArray(chatSessions)) chatSessions = [];

      const savedId = localStorage.getItem(currentIdKey);
      if (savedId && chatSessions.some(s => s.id === savedId)) {
        currentSessionId = savedId;
      } else if (chatSessions.length > 0) {
        currentSessionId = chatSessions[0].id;
      } else {
        currentSessionId = null;
      }

      renderActiveSessionMessages();
      renderRecentsList();
    }

    function renderActiveSessionMessages() {
      document.querySelectorAll('.msg-row').forEach(el => el.remove());

      const activeSession = chatSessions.find(s => s.id === currentSessionId);

        chatHistory = [{ role: 'system', content: getSystemPrompt() }];
        heroCenter.style.display = 'block';
        return;
      }

      chatHistory = activeSession.messages;
      heroCenter.style.display = 'none';

      chatHistory.forEach(msg => {
        if (msg && msg.role === 'user') {
          const text = typeof msg.content === 'string' ? msg.content : (Array.isArray(msg.content) && msg.content[0]?.text ? msg.content[0].text : 'Media Attachment');
          const mediaBase64 = Array.isArray(msg.content) && msg.content[1]?.image_url?.url ? msg.content[1].image_url.url.split(',')[1] : null;
          appendUserMessage(text, mediaBase64, false);
        } else if (msg && msg.role === 'assistant') {
          appendAiMessage(msg.content, false);
        }
      });

      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function renderRecentsList() {
      const listEl = document.getElementById('recentsChatList');
      if (!listEl) return;
      listEl.innerHTML = '';

      if (!Array.isArray(chatSessions) || chatSessions.length === 0) {
        const emptyItem = document.createElement('div');
        emptyItem.className = 'text-secondary small ps-2 italic';
        emptyItem.style.fontSize = '11px';
        emptyItem.innerText = 'Belum ada kelompok chat';
        listEl.appendChild(emptyItem);
        return;
      }

      chatSessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `recent-chat-item ${session.id === currentSessionId ? 'active' : ''}`;

        const titleSpan = document.createElement('div');

        titleSpan.innerHTML = `<i class="bi bi-chat-left-text me-2 text-cyan opacity-75"></i> ${session.title || 'Chat Baru'}`;

        delBtn.title = 'Hapus Kelompok Chat';

        delBtn.onclick = (e) => deleteSession(session.id, e);

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        item.onclick = () => switchSession(session.id);
        listEl.appendChild(item);
      });
    }

    function cleanSessionsForStorage(sessions) {
      if (!Array.isArray(sessions)) return [];
      return sessions.map(session => {
        if (!session) return session;
        return {
          ...session,
          messages: (session.messages || []).map(msg => {
            if (!msg) return msg;
            let content = msg.content;
            if (Array.isArray(content)) {
              content = content.map(part => {
                if (part && part.type === 'image_url' && part.image_url && part.image_url.url && part.image_url.url.length > 300) {
                  return {
                    type: 'image_url',
                    image_url: { url: '[Media Terlampir]' }
                  };
                }
                return part;
              });
            } else if (typeof content === 'string' && content.startsWith('data:image/') && content.length > 300) {
              content = '[Data Foto/Gambar]';
            }
            return {
              ...msg,
              content: content
            };
          })
        };
      });
    }

        const activeSession = chatSessions.find(s => s.id === currentSessionId);
        if (activeSession) {
          activeSession.messages = chatHistory;
          activeSession.updatedAt = Date.now();

      try {
        const cleanData = cleanSessionsForStorage(chatSessions);
        localStorage.setItem(sessionsKey, JSON.stringify(cleanData));
        if (currentSessionId) {
          localStorage.setItem(currentIdKey, currentSessionId);
        } else {
          localStorage.removeItem(currentIdKey);
        }
      } catch (err) {
        console.warn('LocalStorage Quota Exceeded! Safe storage cleanup engaged:', err);
        try {
          localStorage.removeItem(`prince_chat_history_${currentUser.email}`);
          if (chatSessions.length > 3) {
            chatSessions = chatSessions.slice(0, 3);
            const cleanData = cleanSessionsForStorage(chatSessions);
            localStorage.setItem(sessionsKey, JSON.stringify(cleanData));

    }

          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 128;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);

            document.getElementById('profileModalPreview').src = compressedBase64;
            document.getElementById('inputAvatarUrl').value = compressedBase64;
          };
          img.src = e.target.result;

    function processBackgroundRemoval(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          const rBg = (data[0] + data[(canvas.width - 1) * 4]) / 2;
          const gBg = (data[1] + data[(canvas.width - 1) * 4 + 1]) / 2;
          const bBg = (data[2] + data[(canvas.width - 1) * 4 + 2]) / 2;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const diff = Math.sqrt((r - rBg) ** 2 + (g - gBg) ** 2 + (b - bBg) ** 2);
            if (diff < 50 || (r > 230 && g > 230 && b > 230)) {
              data[i + 3] = 0;
            }
          }
          ctx.putImageData(imgData, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl.startsWith('data:') ? dataUrl : 'data:image/jpeg;base64,' + dataUrl;
      });
    }

    function compositeImages(fgDataUrl, bgImageUrl) {
      return new Promise((resolve) => {
        const bgImg = new Image();
        bgImg.crossOrigin = 'anonymous';
        bgImg.onload = () => {
          const fgImg = new Image();
          fgImg.crossOrigin = 'anonymous';
          fgImg.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = bgImg.width;
            canvas.height = bgImg.height;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

            const scale = Math.min((canvas.width * 0.85) / fgImg.width, (canvas.height * 0.85) / fgImg.height);
            const w = fgImg.width * scale;
            const h = fgImg.height * scale;
            const x = (canvas.width - w) / 2;
            const y = canvas.height - h;

            ctx.drawImage(fgImg, x, y, w, h);
            resolve(canvas.toDataURL('image/png'));
          };
          fgImg.onerror = () => resolve(bgImageUrl);
          fgImg.src = fgDataUrl;
        };
        bgImg.onerror = () => resolve(fgDataUrl);
        bgImg.src = bgImageUrl;
      });
    }

    async function uploadToCloudinary(base64Data) {
      if (!base64Data || !base64Data.startsWith('data:image')) return base64Data;
      try {
        const res = await fetch('/api/upload-cloudinary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Data })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.url) {
            return data.url;
          }
        }
      } catch(e) {
        console.warn('Cloudinary upload fallback:', e);
      }
      return base64Data;
    }

    // VOICE CHAT RECOGNITION & AUDIO MEDIARECORDER ENGINE
    let recognitionStarting = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentVoiceNoteUrl = null;

    async function startMediaRecorder() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          try {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = async () => {
              const base64Audio = reader.result;
              try {
                const cloudUrl = await uploadToCloudinary(base64Audio);
                currentVoiceNoteUrl = cloudUrl;
              } catch(cErr) {
                currentVoiceNoteUrl = base64Audio;
              }
            };
            reader.readAsDataURL(audioBlob);
          } catch(bErr) {}
          stream.getTracks().forEach(track => track.stop());
        };
        mediaRecorder.start();
      } catch(err) {
        console.warn('MediaRecorder access:', err);
      }
    }

    function stopMediaRecorder() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try { mediaRecorder.stop(); } catch(e) {}
      }
    }

    function showVoiceIndicator(msg) {

    function startVoiceHold(e) {
      if (e && e.type === 'touchstart') e.preventDefault();
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        return alert('Fitur perekam suara membutuhkan browser Chrome atau Safari di HP/Laptop!');
      }

      if (isRecordingVoice || recognitionStarting) return;

      unlockAudioContext();
      startMediaRecorder();
      recognitionStarting = true;

      try {
        if (recognition) {
          try { recognition.abort(); } catch(a) {}
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.continuous = false;
        recognition.interimResults = true;

        const btn = document.getElementById('btnVoice');
        let finalTranscript = '';

        recognition.onstart = () => {
          recognitionStarting = false;
          isRecordingVoice = true;
          if (btn) btn.classList.add('recording');
          showVoiceIndicator('🎙️ Mendengarkan suara Anda... (Bicara sekarang!)');
        };

        recognition.onresult = (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              finalTranscript += event.results[i][0].transcript;
            } else {
              interim += event.results[i][0].transcript;
            }
          }
          const text = finalTranscript || interim;
          if (text) {
            userInput.value = text;
            showVoiceIndicator(`🎙️ "${text}"`);
          }
        };

        recognition.onerror = (event) => {
          console.warn('Speech Rec Error:', event.error);
          recognitionStarting = false;
          isRecordingVoice = false;
          if (btn) btn.classList.remove('recording');
          hideVoiceIndicator();
          stopMediaRecorder();
          if (event.error === 'not-allowed') {
            alert('Izin Mikrofon belum diaktifkan! Izinkan akses mikrofon di browser Anda.');
          }
        };

        recognition.onend = () => {
          recognitionStarting = false;
          isRecordingVoice = false;
          if (btn) btn.classList.remove('recording');
          hideVoiceIndicator();
          stopMediaRecorder();

          setTimeout(() => {
            const queryText = userInput.value.trim();
            if ((queryText || currentVoiceNoteUrl) && !isProcessing) {
              submitUserMessage();
            }
          }, 300);
        };

        recognition.start();
      } catch(err) {
        console.warn('Voice start exception:', err);
        recognitionStarting = false;
        isRecordingVoice = false;
        stopMediaRecorder();
      }
    }

    function stopVoiceHold(e) {
      if (e && e.type === 'touchend') e.preventDefault();

      stopMediaRecorder();

      if (recognitionStarting) {
        setTimeout(() => {
          if (recognition && isRecordingVoice) {
            try { recognition.stop(); } catch(s) {}
          }
        }, 600);
        return;
      }

      if (isRecordingVoice && recognition) {
        try {
          recognition.stop();
        } catch(s) {}
      }
    }

    function unlockAudioContext() {
      if ('speechSynthesis' in window) {

    function speakText(text, forceSpeak = false) {
      if (!isVoiceOutputEnabled && !forceSpeak) return;
      if (!('speechSynthesis' in window)) return;

      try {
        window.speechSynthesis.cancel();

        let cleanText = (text || '')
          .replace(/```[\s\S]*?```/g, 'Script kode terlampir.')
          .replace(/!\[.*?\]\(.*?\)/g, '')
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
          .replace(/<[^>]*>/g, '')
          .replace(/[#*`_~>|\-]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        if (!cleanText) return;

        if (cleanText.length > 400) {
          cleanText = cleanText.substring(0, 400) + '... dan seterusnya.';
        }

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        if (!availableVoices.length) {
          availableVoices = window.speechSynthesis.getVoices();
        }

        const idVoice = availableVoices.find(v => (v.lang && (v.lang.includes('id') || v.lang.includes('ID'))) || (v.name && v.name.toLowerCase().includes('indonesia')));
        if (idVoice) {
          utterance.voice = idVoice;
        }

        window.speechSynthesis.speak(utterance);
      } catch (err) {
        console.warn('TTS Speak Exception:', err);
      }
    }

        }
      }
    }

    // 2. MAIN SUBMIT MESSAGE WITH GOOGLE GEMINI SIDEBAR UI & OPENROUTER ENGINE
    async function submitUserMessage() {
      const query = userInput.value.trim();
      if ((!query && !selectedMediaBase64) || isProcessing) return;

      if (heroCenter.style.display !== 'none') {
        heroCenter.style.display = 'none';
      }

      // Pastikan ada kelompok chat aktif atau buat kelompok chat baru jika belum ada
      let activeSession = chatSessions.find(s => s.id === currentSessionId);
      if (!activeSession) {
        const titleText = query ? (query.length > 28 ? query.substring(0, 28) + '...' : query) : 'Chat Attachment';
        activeSession = {
          id: 'sess_' + Date.now(),
          title: titleText,
          updatedAt: Date.now(),
          messages: [{ role: 'system', content: getSystemPrompt() }]
        };
        chatSessions.unshift(activeSession);
        currentSessionId = activeSession.id;
        chatHistory = activeSession.messages;
      } else if (chatHistory.length <= 1 && query) {
        activeSession.title = query.length > 28 ? query.substring(0, 28) + '...' : query;
      }

      // Selalu update konteks waktu real-time di system prompt
      if (chatHistory[0] && chatHistory[0].role === 'system') {
        chatHistory[0].content = getSystemPrompt();
      }

      const activeMedia = selectedMediaBase64;
      const activeMime = selectedMediaType;
      const activeVoiceNote = currentVoiceNoteUrl;
      currentVoiceNoteUrl = null;
      removeSelectedMedia();

      userInput.value = '';
      isProcessing = true;

      // Render User Message UI
      appendUserMessage(query, activeMedia ? activeMedia.split(',')[1] : null, true, activeVoiceNote);

      // Save User Message to History Array
      if (activeMedia) {
        chatHistory.push({
          role: "user",
          content: [
            { type: "text", text: query || "Analisis foto / media terlampir ini." },
            { type: "image_url", image_url: { url: activeMedia } }
          ]
        });
      } else {
        chatHistory.push({ role: "user", content: query });
      }
      syncChatHistoryToGoogleDrive();
      renderRecentsList();

      const typingId = 'typing_' + Date.now();
      appendTypingIndicator(typingId);

      const qLower = (query || '').toLowerCase();

      // ROUTE A: COMPLETE IMAGE PROCESSING SUITE (Text-to-Image, Remove BG, Change BG, 3D Pixar Cartoon)
      if (activeMedia || qLower.includes('buatkan gambar') || qLower.includes('buat gambar') || qLower.includes('hapus background') || qLower.includes('remove bg') || qLower.includes('ganti background') || qLower.includes('kartun 3d') || qLower.includes('pixar') || qLower.includes('disney') || qLower.includes('edit foto') || qLower.includes('generate image') || qLower.includes('lukis')) {
        
        // A1: HAPUS BACKGROUND (AI Background Remover)
        if (qLower.includes('hapus background') || qLower.includes('remove bg') || qLower.includes('potong background') || qLower.includes('tanpa background')) {
          removeTypingIndicator(typingId);
          if (activeMedia) {
            try {
              const transparentResult = await processBackgroundRemoval(activeMedia);
              const cloudUrl = await uploadToCloudinary(transparentResult);
              const aiReply = `✂️ **Hasil Hapus Background (AI Background Remover):**\n\n![Tanpa Background](${cloudUrl})\n\n💡 *Tersimpan aman di Cloudinary CDN Cloud Storage! Gunakan tombol "Ganti Background" untuk menempelkan latar baru di belakang subjek ini.*`;
              appendAiMessage(aiReply, true);
              chatHistory.push({ role: "assistant", content: aiReply });
            } catch(bgErr) {
              console.error('BG Removal Error:', bgErr);
            }
          } else {
            const aiReply = `⚠️ **Silakan Unggah Foto Terlebih Dahulu!**\n\nKlik tombol **+** di sebelah kiri kolom input untuk memilih foto yang ingin dihapus backgroundnya.`;
            appendAiMessage(aiReply, true);
            chatHistory.push({ role: "assistant", content: aiReply });
          }
          syncChatHistoryToGoogleDrive();
          isProcessing = false;
          return;
        }

        // A2: GANTI BACKGROUND (AI Background Replacement & Composite)
        if (qLower.includes('ganti background') || qLower.includes('change background') || qLower.includes('ganti latar')) {
          removeTypingIndicator(typingId);
          const bgPrompt = query.replace(/(ganti background|change background|ganti latar)/gi, '').trim() || 'pemandangan studio foto mewah futuristik';
          const bgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent('aesthetic backdrop scene ' + bgPrompt)}?width=800&height=800&nologo=true&seed=${Math.floor(Math.random() * 100000)}`;

          if (activeMedia) {
            try {
              const transparentResult = await processBackgroundRemoval(activeMedia);
              const mergedResult = await compositeImages(transparentResult, bgUrl);
              const cloudUrl = await uploadToCloudinary(mergedResult);
              const aiReply = `🌄 **Hasil Ganti Background dengan tema "${bgPrompt}":**\n\n![Hasil Ganti Background](${cloudUrl})\n\n☁️ *Di-host secara permanen di Cloudinary CDN Storage!*`;
              appendAiMessage(aiReply, true);
              chatHistory.push({ role: "assistant", content: aiReply });
            } catch(cErr) {
              console.error('Composite Error:', cErr);
            }
          } else {
            const aiReply = `🌄 **Latar Belakang AI Baru dengan tema "${bgPrompt}":**\n\n![Background AI](${bgUrl})\n\n💡 *Unggah foto Anda dengan tombol **+** untuk menggabungkan subjek Anda di atas latar ini!*`;
            appendAiMessage(aiReply, true);
            chatHistory.push({ role: "assistant", content: aiReply });
          }
          syncChatHistoryToGoogleDrive();
          isProcessing = false;
          return;
        }

        // A3: KARTUN 3D DISNEY / PIXAR STYLE TRANSFER (Img2Img / Prompt Styling)
        if (qLower.includes('kartun 3d') || qLower.includes('pixar') || qLower.includes('disney') || qLower.includes('animasi 3d')) {
          try {
            const stylePrompt = (query || 'character portrait').replace(/(ganti gaya ke|kartun 3d|pixar|disney|animasi 3d|ubah ke)/gi, '').trim();
            const fullPrompt = `3D Disney Pixar style animation character portrait, 3D render, octane render, vibrant studio lighting, 8k resolution, detailed Pixar face features, ${stylePrompt}`;
            const generatedImgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=800&height=800&nologo=true&seed=${Math.floor(Math.random() * 100000)}&model=flux`;

            removeTypingIndicator(typingId);
            const aiReply = `🎭 **Hasil Transformasi Gaya Kartun 3D Pixar / Disney:**\n\n![Kartun 3D Pixar Style](${generatedImgUrl})\n\n✨ *Model Engine: FLUX.1-schnell & Hugging Face Inference (3D Animation Render)*`;

            appendAiMessage(aiReply, true);
            chatHistory.push({ role: "assistant", content: aiReply });
            syncChatHistoryToGoogleDrive();
            speakText("Hasil transformasi ke gaya Kartun 3D Pixar berhasil dibuat!");
            isProcessing = false;
            return;
          } catch(err) {
            console.error('3D Cartoon Gen Error:', err);
          }
        }

        // A4: GENERASI GAMBAR TEXT-TO-IMAGE (FLUX.1-schnell / Pollinations Engine / HuggingFace)
        try {
          const imagePrompt = (query || 'formal professional portrait attire').replace(/(buatkan gambar|buat gambar|generate image|lukis)/gi, '').trim();
          const generatedImgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent('high quality realistic photo ' + imagePrompt)}?width=800&height=800&nologo=true&seed=${Math.floor(Math.random() * 100000)}&model=flux`;

          removeTypingIndicator(typingId);
          const aiReply = `Berikut adalah hasil foto pesanan Anda dengan tema **"${imagePrompt}"**:\n\n![Hasil Generate Foto](${generatedImgUrl})\n\n✨ *Model Engine: FLUX.1-schnell / Hugging Face Inference Cloud (Gratis & Bebas Kuota)*`;

          appendAiMessage(aiReply, true);
          chatHistory.push({ role: "assistant", content: aiReply });
          syncChatHistoryToGoogleDrive();
          speakText("Foto pesanan Anda berhasil dibuat!");
          isProcessing = false;
          return;
        } catch(imgErr) {
          console.error('Image Gen Error:', imgErr);
        }
      }

      // Backend AI Call via Gemini 3.6 Flash Proxy
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        const cleanHistory = (chatHistory || []).map(m => ({
          role: m.role === 'assistant' ? 'assistant' : 'user',
          content: typeof m.content === 'string' ? m.content : (Array.isArray(m.content) ? m.content.map(c => c.text || '').join(' ') : (query || ''))
        }));

        const response = await fetch('/api/prince-ai/chat', {
          method: 'POST',
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: cleanHistory,
            query: query,
            user_email: currentUser.email,
            user_name: currentUser.name
          })
        });
        clearTimeout(timeoutId);

        if (response.ok) {
          const data = await response.json();
          if (data.success && data.reply) {
            removeTypingIndicator(typingId);
            let aiReply = data.reply.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
            if (/^(Okay|First|The user|Let me think)/i.test(aiReply) && aiReply.includes('\n\n')) {
              const parts = aiReply.split(/\n\n+/);
              if (parts.length > 1) aiReply = parts.slice(1).join('\n\n').trim();
            }
            appendAiMessage(aiReply, true);
            chatHistory.push({ role: "assistant", content: aiReply });
            syncChatHistoryToGoogleDrive();
            speakText(aiReply);
            isProcessing = false;
            return;
          }
        }
      } catch (proxyErr) {
        console.error('Gemini Proxy Chat Error:', proxyErr);
      }

      // ROUTE C: SMART MAS RESPONSE ENGINE (INSTANT LOCAL FALLBACK)
      removeTypingIndicator(typingId);
      const fallbackReply = generateSmartMASReply(query, currentUser);
      appendAiMessage(fallbackReply, true);
      chatHistory.push({ role: "assistant", content: fallbackReply });
      syncChatHistoryToGoogleDrive();
      speakText(fallbackReply);
      isProcessing = false;
    }

    function generateSmartMASReply(userQuery, user) {

      const live = getLiveSystemTimeString();

      // DETEKSI PERTANYAAN LAPAR / MAKAN
      if (/lapar|makan|laper|makanan|haus/i.test(q)) {

Tapi kalau Kak **${user.name}** / Bos Aang.js yang lapar, mending rehat sejenak yuk! Cari kopi, makanan enak, atau es teh manis dulu! ☕🍔

Ada yang mau saya bantu persiapkan atau periksa di Portal ERP sebelum Kakak rehat? 🚀`;
      }

      // DETEKSI PERTANYAAN NAMA / PRINCE HERRY
      if (/prince herry|prince harry|siapa kamu|siapa dirimu/i.test(q)) {
        return `Bukan Prince Harry Kerajaan Inggris ya! 👑 Saya adalah **PRINCE AI**, Super Assistant kecerdasan buatan bawaan Portal ERP PT Chandra Nugerah yang dirancang oleh **Aang.js** dan Tim IT CNC.

Saya bertugas mendampingi Anda menganalisis laporan AP, RPB Pembelian, stok part, hingga incident log. Ada yang bisa saya bantu sekarang? 😊`;
      }

      // DETEKSI PERTANYAAN SALAH RECEIPT
      if (/salah receipt|receipt salah|keliru barang|salah barang|salah po|salah invoice/i.test(q)) {
        return `🔍 **Panduan Melacak Kesalahan Receipt / Barang di Portal AP PT CNC:**

1. 📋 **Cek Incident Log:** Buka menu *Incident & Corrective Action Tracking* untuk melihat riwayat laporan kesalahan penerimaan barang dari Dept Purchasing/Warehouse.
2. 📑 **Cek Detail PO vs Receipt:** Bandingkan No. PO dan dokumen Sj/Receipt di Modul AP Invoice Entry atau RPB Pembelian.
3. 👤 **Identifikasi User Input:** Sistem mencatat identitas penerima / user login saat input receipt dilakukan.

Mau saya bantu pandu membuka modul Incident Log atau RPB? 🚀`;
      }

      // DETEKSI KOREKSI / UPDATE LOKASI OTOMATIS DARI CHAT USER
      if (/lokasi (?:saya|kami)|bukan di|saya (?:sekarang |saat ini )?(?:berada|ada)? di|set lokasi/i.test(q)) {
        let newLoc = '';
        const matchLoc = q.match(/(?:bukan di [^,.]+ tapi |di |berada di |ada di |ke )([^,.?]+)/i);
        if (matchLoc && matchLoc[1]) {
          newLoc = matchLoc[1].replace(/(bro|sis|gan|admin|dong|ya|terima kasih|thanks|bukan|salah)/gi, '').trim();
        }

        if (newLoc && !/^tangerang$/i.test(newLoc) && newLoc.length > 2) {
          localStorage.setItem('prince_manual_location', newLoc);
          userLocation.isManual = true;
          userLocation.city = newLoc;
          userLocation.displayLocation = `${newLoc} (Lokasi Kustom)`;
          updateUserLocationUI();

          return `✅ **Lokasi Berhasil Diperbarui & Disimpan!**

Siap! Lokasi Anda telah saya perbarui dan diset ke: **"${newLoc}"**.

📍 **Lokasi Aktif:** ${newLoc}
⏱️ **Waktu Pembaruan:** ${live.fullDate} pukul ${live.fullTime}

Semua informasi posisi, cuaca, dan rekomendasi tempat terdekat selanjutnya akan disesuaikan dengan **${newLoc}**. Ada yang ingin Anda tanyakan lagi?`;
        } else if (/bukan di/i.test(q)) {
          return `Siap, mohon maaf atas ketidaksesuaian lokasi sebelumnya!

📍 **Cara Mengubah Lokasi Anda secara Instan:**
Cukup ketik di sini:
> **"lokasi saya di [Nama Kota / Kecamatan Anda]"** *(contoh: "lokasi saya di Jakarta Barat" atau "lokasi saya di Surabaya")*

Atau klik lencana **lokasi** di sudut kiri bawah sidebar untuk memasukkan nama kota/lokasi presisi Anda!`;
        }
      }

      // DETEKSI KONTEN LAPORAN BACKEND ERP / RPB / FINANSIAL
      if (/rpb|pembelian|faktur|ap invoice|supplier|inventory|stok|hutang/i.test(q)) {
        if (backendLiveReports) {
          const rpb = backendLiveReports.rpb_summary || {};
          const inv = backendLiveReports.inventory_summary || {};
          const sup = backendLiveReports.suppliers_summary || {};
          const ap  = backendLiveReports.ap_invoices_summary || {};
          
          return `📊 **Ringkasan Laporan ERP Live (PT Chandra Nugerah):**

- 📦 **Laporan Pembelian RPB (2026):**
  • Total Transaksi: **${rpb.total_records || 0}** record
  • Total Nilai Pembelian: **Rp ${Number(rpb.total_amount || 0).toLocaleString('id-ID')}**
  • Periode Data: ${rpb.date_range ? rpb.date_range.min_date.slice(0,10) + ' s/d ' + rpb.date_range.max_date.slice(0,10) : '2026'}

- 🏭 **Master Supplier Active:** **${sup.total_active_suppliers || 0}** supplier terdaftar
- 📑 **Faktur AP Invoice:** **${ap.total_invoices || 0}** faktur (Total: **Rp ${Number(ap.total_amount || 0).toLocaleString('id-ID')}**)
- 📦 **Inventory Part CNC:** **${inv.total_part_items || 0}** part terdata

*Data diambil langsung dari PostgreSQL & Epicor (Read-Only).*`;
        }
      }

      if (/halo|hi|hello|pagi|siang|malam|apa kabar|sedang apa/i.test(q)) {
        return `Halo **${user.name}**! Saya **PRINCE AI** 👑.

Saya sedang aktif mendampingi Anda di Portal ERP PT Chandra Nugerah (Waktu Sistem: ${live.fullTime}). 
Saya siap membantu Anda menganalisis laporan RPB, memeriksa stok part, membuat laporan incident, maupun menghitung efisiensi produksi!

Ada yang bisa saya bantu sekarang?`;
      }

      // RESPONS LOKASI / POSISI / GPS / ALAMAT / KOTA
      if (/lokasi|posisi|dimana saya|tempat saya|gps|di mana saya|alamat|daerah|kota/i.test(q)) {
        const locName = userLocation && userLocation.displayLocation ? userLocation.displayLocation : 'Indonesia';
        return `📍 **Informasi Lokasi Real-Time Anda:**

🗺️ **Lokasi Terdeteksi:** ${userLocation.city || 'Indonesia'}, ${userLocation.country || 'Indonesia'}
📡 **Presisi Koordinat / Status:** ${locName}
⏱️ **Waktu Deteksi:** ${live.fullDate} pukul ${live.fullTime}

🔗 **[Lihat Lokasi Anda di Google Maps](https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(userLocation.city || locName)})**

💡 *Jika lokasi belum sesuai, ketik misal: **"lokasi saya di [Nama Kota Anda]"** untuk memperbarui secara otomatis!*`;
      }

      // RESPONS REALT-TIME WAKTU / JAM / HARI / TANGGAL / TAHUN
      if (/jam|waktu|hari|tanggal|sekarang|tahun/i.test(q)) {
        return `⏰ **Informasi Waktu Real-Time Saat Ini:**

📅 **Hari & Tanggal:** ${live.fullDate}
⌚ **Waktu / Jam:** ${live.fullTime}
📍 **Zona Waktu:** WIB (Waktu Indonesia Barat)

Ada yang perlu disesuaikan dengan jadwal atau laporan Anda?`;
      }

      // RESPONS PENCARIAN GOOGLE / WEB / BERITA
      if (/cari|google|search|berita|cuaca|info|dimana/i.test(q)) {
        const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(userQuery)}`;
        return `🔍 **Pencarian Web & Google:**

Mengenai pertanyaan Anda:
> *"${userQuery}"*

🌐 **Waktu Akses:** ${live.fullDate} pukul ${live.fullTime}
🔗 **[Klik di sini untuk melihat hasil pencarian langsung di Google](${searchUrl})**

Sistem Multi-Agent PRINCE AI juga telah memproses konteks query ini. Silakan sampaikan jika Anda membutuhkan analisis lanjutan!`;
      }

      // RESPONS RATING / PENILAIAN / EVALUASI APLIKASI
      if (/rating|penilaian|nilai|skor|review|bagus|performa|sistem ini|aplikasi ini/i.test(q)) {
        return `🌟 **Rating & Performa Sistem ERP PT Chandra Nugerah:** **10 / 10** 💎

- 🛡️ **Kerahasiaan & Keamanan Data (10/10):** 100% Read-Only Lokal (localhost:3000), Data tidak bocor ke pihak umum.
- ⚡ **Integrasi Data Live (10/10):** Terhubung langsung ke PostgreSQL & Sync Real-Time Epicor ERP.
- 🚨 **Fitur Utama Terintegrasi:**
  • Laporan Pembelian RPB & AP Invoice Entry
  • Master Supplier & Master Part CNC
  • Incident & Corrective Action Tracking System
  • Tracking Tugas Luar & Security Scan
- 🤖 **PRINCE AI Super Assistant:** Multi-Agent Swarm AI untuk analisis biaya, pembanding harga supplier, & konsultasi efisiensi produksi.

Ada modul atau fitur tertentu yang ingin Anda optimalkan hari ini?`;
      }

      if (/halo|hi|hello|pagi|siang|malam|apa kabar|sedang apa/i.test(q)) {
        return `Halo **${user.name}**! Saya **PRINCE AI** 👑.

Saya sedang aktif mendampingi Anda di Portal ERP PT Chandra Nugerah (Waktu Sistem: ${live.fullTime}). 
Saya siap membantu Anda menganalisis laporan RPB, memeriksa stok part, membuat laporan incident, maupun menghitung efisiensi produksi!

Ada yang bisa saya bantu sekarang?`;
      }

      // RESPONS CERDAS & DINAMIS UNTUK QUERY UMUM
      return `💡 **PRINCE AI Assistant:**

Terima kasih atas pertanyaannya, **${user.name}**! Mengenai *"<sup>${userQuery}</sup>"*, saya siap membantu Anda menganalisis data, memberikan rekomendasi operasional, atau menjelaskan fitur di portal AP PT Chandra Nugerah.

Silakan sampaikan lebih detail apa yang ingin Anda ketahui atau hitung! 🚀`;
    }

    function appendUserMessage(text, mediaBase64, autoScroll = true, audioUrl = null) {
      const row = document.createElement('div');
      row.className = 'msg-row user';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar user';
      avatar.innerHTML = `<img src="${currentUser.avatar}" alt="User Avatar">`;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      
      let html = `<div class="small fw-bold mb-1 opacity-75">${currentUser.name}</div>`;

      if (audioUrl) {
        html += `
          <div class="voice-note-card mb-2 p-2 rounded-3" style="background: rgba(0, 223, 216, 0.12); border: 1px solid rgba(0, 223, 216, 0.35); min-width: 230px;">
            <div class="d-flex align-items-center gap-2 mb-1">
              <i class="bi bi-mic-fill text-cyan fs-5"></i>
              <span class="small fw-bold text-cyan font-monospace">Voice Note Pesan Suara</span>
            </div>
            <audio controls src="${audioUrl}" style="height: 32px; width: 100%; border-radius: 16px; outline: none;"></audio>
          </div>
        `;
      }

      if (mediaBase64) {
        html += `<img src="data:image/jpeg;base64,${mediaBase64}" class="img-fluid rounded mb-2" style="max-height: 200px;">`;
      }
      if (text) {
        html += `<div>${text}</div>`;
      }
      bubble.innerHTML = html;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatStream.appendChild(row);
      if (autoScroll) {
        setTimeout(() => {
          chatStream.scrollTo({ top: chatStream.scrollHeight, behavior: 'smooth' });
        }, 50);
      }
    }

    function appendAiMessage(text, autoScroll = true) {
      const row = document.createElement('div');
      row.className = 'msg-row ai';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ai';
      avatar.innerHTML = '<i class="fa-solid fa-crown"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble position-relative';
      if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
        try {
          bubble.innerHTML = marked.parse(text);
        } catch(pErr) {
          bubble.innerText = text;
        }
      } else {
        bubble.innerText = text;
      }

      // Add Speaker Audio Action Icon to top right of AI bubble
      const ttsBtn = document.createElement('button');
      ttsBtn.className = 'btn btn-sm btn-link text-secondary p-0 position-absolute top-0 end-0 me-2 mt-1 opacity-75';
      ttsBtn.title = 'Dengarkan Suara Pesan Ini';
      ttsBtn.innerHTML = '<i class="bi bi-volume-up-fill text-cyan" style="font-size: 0.95rem;"></i>';
      ttsBtn.onclick = (e) => {
        e.stopPropagation();
        speakText(text, true);
      };
      bubble.insertBefore(ttsBtn, bubble.firstChild);

      bubble.querySelectorAll('pre').forEach((pre) => {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerHTML = '<i class="bi bi-clipboard me-1"></i> Copy';
        btn.onclick = () => {
          const code = pre.querySelector('code')?.innerText || pre.innerText;
          navigator.clipboard.writeText(code);
          btn.innerHTML = '<i class="bi bi-check me-1"></i> Copied!';
          setTimeout(() => btn.innerHTML = '<i class="bi bi-clipboard me-1"></i> Copy', 2000);
        };
        pre.appendChild(btn);
      });

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatStream.appendChild(row);
      if (autoScroll) {
        setTimeout(() => {
          chatStream.scrollTo({ top: chatStream.scrollHeight, behavior: 'smooth' });
        }, 50);
      }
    }

    function appendTypingIndicator(id) {
      const row = document.createElement('div');
      row.className = 'msg-row ai';
      row.id = id;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ai';
      avatar.innerHTML = '<i class="fa-solid fa-crown"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = `
        <div class="d-flex align-items-center gap-2">
          <div class="spinner-border spinner-border-sm text-cyan" role="status"></div>
          <span class="small text-secondary font-monospace">PRINCE AI sedang memproses...</span>
        </div>
      `;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatStream.appendChild(row);
      setTimeout(() => {
        chatStream.scrollTo({ top: chatStream.scrollHeight, behavior: 'smooth' });
      }, 50);
    }

    function removeTypingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
