<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINCE AI — Google Gemini Style Platform</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Outfit & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Marked.js for Markdown & Highlight.js for Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #0e1017;
      --bg-sidebar: #13151f;
      --bg-input: #1e202e;
      --bg-card: rgba(255, 255, 255, 0.04);
      --accent-cyan: #00dfd8;
      --accent-purple: #7928ca;
      --accent-pink: #ff0080;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* GOOGLE GEMINI STYLE SIDEBAR */
    .gemini-sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .gemini-sidebar.collapsed {
      width: 70px;
    }

    .gemini-sidebar.collapsed .sidebar-text,
    .gemini-sidebar.collapsed .recents-section,
    .gemini-sidebar.collapsed .user-info {
      display: none !important;
    }

    .sidebar-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      background: linear-gradient(135deg, #00dfd8 0%, #7928ca 50%, #ff0080 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .sidebar-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .sidebar-toggle-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-new-chat {
      margin: 10px 16px;
      padding: 12px 18px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn-new-chat:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-cyan);
    }

    .sidebar-menu {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-item {
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      font-size: 0.93rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .sidebar-item:hover, .sidebar-item.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* RECENTS CHAT LIST */
    .recents-section {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .recents-section::-webkit-scrollbar { width: 4px; }
    .recents-section::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

    .recents-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-uppercase;
      color: var(--text-muted);
      margin: 12px 6px 6px 6px;
      letter-spacing: 0.5px;
    }

    .recent-chat-item {
      padding: 8px 12px;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.86rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .recent-chat-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
    }

    /* MAIN CHAT AREA */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .chat-stream-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
    }

    .chat-stream-container::-webkit-scrollbar { width: 6px; }
    .chat-stream-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    /* CENTER GEMINI HERO TITLE */
    .hero-center {
      margin: auto 0;
      text-align: center;
      padding: 20px;
    }

    .hero-center-title {
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 28px;
    }

    /* GEMINI FLOATING INPUT BAR */
    .gemini-input-container {
      max-width: 850px;
      margin: 0 auto 30px auto;
      width: 100%;
      padding: 0 20px;
    }

    .gemini-input-box {
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      transition: all 0.25s;
    }

    .gemini-input-box:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 12px 45px rgba(0, 223, 216, 0.25);
    }

    .gemini-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.05rem;
      outline: none;
    }

    .model-selector-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--accent-cyan);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .input-action-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-send-gemini {
      background: linear-gradient(135deg, #7928ca 0%, #00dfd8 100%);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(121, 40, 202, 0.45);
    }

    /* BUBBLE CHAT STYLES */
    .msg-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }

    .msg-avatar.ai {
      background: linear-gradient(135deg, #7928ca 0%, #00dfd8 100%);
      color: #fff;
    }

    .msg-avatar.user img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 18px 24px;
      border-radius: 20px;
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .msg-row.ai .msg-bubble {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top-left-radius: 4px;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .msg-bubble pre {
      background: #161824;
      border-radius: 12px;
      padding: 16px;
      overflow-x: auto;
      margin: 14px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* MEDIA PREVIEW */
    .media-preview-area {
      display: flex;
      gap: 10px;
      padding: 8px 20px;
      max-width: 850px;
      margin: 0 auto;
    }
    .media-preview-item {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .media-preview-item img, .media-preview-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .media-preview-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- GOOGLE GEMINI SIDEBAR -->
  <aside class="gemini-sidebar" id="geminiSidebar">
    <div>
      <div class="sidebar-header">
        <a href="#" class="sidebar-brand">
          <i class="fa-solid fa-crown text-warning"></i> <span class="sidebar-text">PRINCE AI</span>
        </a>
        <button class="sidebar-toggle-btn" title="Toggle Sidebar" onclick="toggleSidebar()">
          <i class="bi bi-layout-sidebar-inset"></i>
        </button>
      </div>

      <div class="btn-new-chat" onclick="startNewChat()">
        <i class="bi bi-plus-lg"></i>
        <span class="sidebar-text">New chat</span>
      </div>

      <div class="sidebar-menu">
        <a href="#" class="sidebar-item active" id="tabChats" onclick="selectTab('chats')">
          <i class="bi bi-chat-dots-fill"></i>
          <span class="sidebar-text">Chats</span>
        </a>
        <a href="#" class="sidebar-item" id="tabImages" onclick="selectTab('images')">
          <i class="bi bi-image-fill"></i>
          <span class="sidebar-text">Images</span>
        </a>
        <a href="#" class="sidebar-item" id="tabVideos" onclick="selectTab('videos')">
          <i class="bi bi-film"></i>
          <span class="sidebar-text">Videos</span>
        </a>
        <a href="#" class="sidebar-item" onclick="alert('Mogaworld ERP Dashboard Integrated')">
          <i class="bi bi-grid-fill"></i>
          <span class="sidebar-text">ERP Dashboard</span>
        </a>
      </div>

      <!-- RECENTS LIST WITH CLEAR BUTTON -->
      <div class="recents-section">
        <div class="d-flex align-items-center justify-content-between recents-title pe-2">
          <span>Recents</span>
          <button class="btn btn-link text-danger text-decoration-none p-0" style="font-size: 10px;" onclick="clearChatHistory()" title="Hapus Riwayat Chat">
            <i class="bi bi-trash3-fill"></i> Hapus
          </button>
        </div>
        <div id="recentsChatList"></div>
      </div>
    </div>

    <!-- SIDEBAR FOOTER (USER PROFILE & GOOGLE DRIVE 5.39TB LINK) -->
    <div class="sidebar-footer">
      <div class="user-badge" onclick="openProfileModal()">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aang" alt="Avatar" class="user-avatar" id="sidebarAvatarImg">
        <div class="user-info" style="line-height: 1.2;">
          <div class="fw-bold text-white small" id="sidebarUserName">Aang Crypto</div>
          <a href="https://drive.google.com/drive/project/1aaGCAnqWGTC7jkzXmE8r97-Erp0k0giu?hl=ID" target="_blank" class="text-info text-decoration-none" style="font-size: 10px;">
            <i class="bi bi-cloud-check-fill text-success"></i> Drive 5.39 TB
          </a>
        </div>
      </div>
      <button class="sidebar-toggle-btn text-secondary" title="Settings / Login" onclick="openAuthModal('login')">
        <i class="bi bi-gear-fill"></i>
      </button>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main class="main-wrapper">
    
    <!-- CHAT STREAM CONTAINER -->
    <div class="chat-stream-container" id="chatStream">
      <div class="hero-center" id="heroCenter">
        <h1 class="hero-center-title" id="heroTitle">What can I help with, Aang?</h1>
      </div>
    </div>

    <!-- MEDIA PREVIEW -->
    <div id="mediaPreviewArea" class="media-preview-area d-none"></div>

    <!-- GEMINI FLOATING INPUT BAR -->
    <div class="gemini-input-container">
      <div class="gemini-input-box">
        <input type="file" id="fileInput" accept="image/*,video/*" class="d-none" onchange="handleFileSelect(event)">
        <button class="input-action-btn" title="Upload Media" onclick="document.getElementById('fileInput').click()">
          <i class="bi bi-plus-lg"></i>
        </button>

        <input type="text" class="gemini-input" id="userInput" placeholder="Ask Prince AI..." onkeydown="handleKeyPress(event)" autocomplete="off">

        <div class="model-selector-badge" title="Multi-Agent Model Engine">
          <span>Multi-Agent Ultra</span> <i class="bi bi-chevron-down"></i>
        </div>

        <button class="input-action-btn btn-voice" id="btnVoice" title="Voice Input" onclick="toggleVoiceRecording()">
          <i class="bi bi-mic-fill"></i>
        </button>

        <button class="btn-send-gemini" onclick="submitUserMessage()" id="btnSend">
          <i class="bi bi-arrow-up-short" style="font-size: 1.6rem;"></i>
        </button>
      </div>
      <div class="text-center mt-2" style="font-size: 11px; color: var(--text-muted);">
        Prince AI can make mistakes. Verify important info. Connected to Google Drive 5.39 TB Project.
      </div>
    </div>

  </main>

  <!-- AUTH MODAL (LOGIN & REGISTER) -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-white" style="background: rgba(19, 21, 31, 0.95); border: 1px solid rgba(121, 40, 202, 0.4); backdrop-filter: blur(20px);">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title font-monospace" id="authModalTitle"><i class="bi bi-shield-lock-fill text-warning me-2"></i> Login Akun PRINCE AI</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label small text-secondary">Alamat Email:</label>
            <input type="email" id="authEmail" class="form-control text-white" placeholder="email@domain.com" style="background: #161824; border: 1px solid #334155;">
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small text-secondary mb-0">Password:</label>
              <a href="#" class="small text-info text-decoration-none" onclick="forgotPasswordPrompt()">Lupa Password?</a>
            </div>
            <input type="password" id="authPassword" class="form-control text-white" placeholder="••••••••" style="background: #161824; border: 1px solid #334155;">
          </div>
          <div id="authRegisterExtra" class="d-none">
            <div class="mb-3">
              <label class="form-label small text-secondary">Nama Lengkap / Username:</label>
              <input type="text" id="authName" class="form-control text-white" placeholder="Nama Anda" style="background: #161824; border: 1px solid #334155;">
            </div>
          </div>
        </div>
        <div class="modal-footer border-top border-secondary justify-content-between">
          <button type="button" class="btn btn-link text-info text-decoration-none p-0 small" onclick="toggleAuthMode()" id="authToggleBtn">Belum punya akun? Daftar Registrasi</button>
          <button type="button" class="btn btn-primary px-4 fw-bold" onclick="processAuthSubmit()" id="authSubmitBtn">Login Now</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL (CHANGE AVATAR) -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-white" style="background: rgba(19, 21, 31, 0.95); border: 1px solid rgba(0, 223, 216, 0.4); backdrop-filter: blur(20px);">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title font-monospace"><i class="bi bi-image-fill text-cyan me-2"></i> Pengaturan Foto Profil (Avatar)</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aang" id="profileModalPreview" class="rounded-circle mb-3 border border-2 border-cyan" style="width: 90px; height: 90px; object-fit: cover;">
          
          <div class="mb-3 text-start">
            <label class="form-label small text-secondary">URL Foto Profil / Unggah Gambar:</label>
            <input type="text" id="inputAvatarUrl" class="form-control text-white mb-2" placeholder="https://..." style="background: #161824; border: 1px solid #334155;">
            <input type="file" id="inputAvatarFile" accept="image/*" class="form-control" style="background: #161824; border: 1px solid #334155; color: #fff;" onchange="previewAvatarFile(event)">
          </div>
        </div>
        <div class="modal-footer border-top border-secondary justify-content-between">
          <button type="button" class="btn btn-outline-danger btn-sm" onclick="logoutUser()">Logout</button>
          <button type="button" class="btn btn-cyan btn-sm fw-bold px-4 text-dark" style="background: #00dfd8;" onclick="saveUserProfile()">Simpan Foto Profil</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. VARIABEL GLOBAL HISTORY CHAT & USER SESSION
    let isProcessing = false;
    let currentUser = JSON.parse(localStorage.getItem('prince_user_session') || JSON.stringify({
      email: 'aangcrypto21@gmail.com',
      name: 'Aang Crypto',
      avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Aang'
    }));

    let chatHistory = [];
    let selectedMediaBase64 = null;
    let selectedMediaType = null;
    let isRecordingVoice = false;
    let recognition = null;

    const chatStream = document.getElementById('chatStream');
    const userInput = document.getElementById('userInput');
    const heroCenter = document.getElementById('heroCenter');

    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateUserNavDisplay();
      loadHistoryToUI();
    });

    function toggleSidebar() {
      document.getElementById('geminiSidebar').classList.toggle('collapsed');
    }

    let activeTab = 'chats';

    function clearChatHistory() {
      if (confirm('Apakah Anda yakin ingin menghapus seluruh riwayat chat?')) {
        const userKey = `prince_chat_history_${currentUser.email}`;
        localStorage.removeItem(userKey);
        chatHistory = [chatHistory[0]];
        document.querySelectorAll('.msg-row').forEach(el => el.remove());
        heroCenter.style.display = 'block';
        renderRecentsList();
        alert('✅ Riwayat chat telah berhasil dihapus!');
      }
    }

    function selectTab(tabName) {
      activeTab = tabName;

      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(tabName === 'chats' ? 'tabChats' : (tabName === 'images' ? 'tabImages' : 'tabVideos'));
      if (activeEl) activeEl.classList.add('active');

      // Clear current chat messages from stream for fresh clean studio screen
      document.querySelectorAll('.msg-row').forEach(el => el.remove());

      if (tabName === 'images') {
        heroCenter.style.display = 'block';
        document.getElementById('heroTitle').innerText = '🎨 PRINCE AI — Image Studio & Photo Editor';
        userInput.placeholder = 'Ketik prompt gambar (contoh: "buatkan gambar naga cybernetic" atau "edit foto nuansa formal")...';
      } else if (tabName === 'videos') {
        heroCenter.style.display = 'block';
        document.getElementById('heroTitle').innerText = '🎥 PRINCE AI — Video Analysis & Studio';
        userInput.placeholder = 'Upload file video / ketik instruksi analisis video...';
      } else {
        const firstName = currentUser.name ? currentUser.name.split(' ')[0] : 'User';
        document.getElementById('heroTitle').innerText = `What can I help with, ${firstName}?`;
        userInput.placeholder = 'Ask Prince AI...';

    function updateUserNavDisplay() {
      const firstName = currentUser.name ? currentUser.name.split(' ')[0] : 'User';
      document.getElementById('sidebarUserName').innerText = currentUser.name || 'User';
      document.getElementById('sidebarAvatarImg').src = currentUser.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Aang';

        document.getElementById('heroTitle').innerText = `What can I help with, ${firstName}?`;

    }

    function loadHistoryToUI() {
      const userKey = `prince_chat_history_${currentUser.email}`;
      chatHistory = JSON.parse(localStorage.getItem(userKey)) || [
        {
          role: "system",
          content: `Namamu adalah PRINCE AI. Kamu adalah Super Assistant Multi-Agent Mogaworld ERP. 
Kamu BISA dan SANGAT AHLI membantu:
1. Generate & Edit Foto/Gambar AI (Model FLUX / Pollinations Engine).
2. Analisis Foto Struk/Nota OCR & Video Document Analysis.
3. Matematika Rumit & Akuntansi (DeepSeek R1).
4. Coding Fullstack & Script Pemrograman (Claude 3.5 Sonnet / GPT-4o).
5. Panduan ERP Mogaworld, AP Invoice, & Checkpoint GPS.`
        }
      ];

      // Reset UI Stream
      document.querySelectorAll('.msg-row').forEach(el => el.remove());

      if (chatHistory.length <= 1) {
        heroCenter.style.display = 'block';
        renderRecentsList();
        return;
      }

      heroCenter.style.display = 'none';
      chatHistory.forEach(msg => {
        if (msg.role === 'user') {
          const text = typeof msg.content === 'string' ? msg.content : (msg.content[0]?.text || 'Media Attachment');
          const mediaBase64 = Array.isArray(msg.content) && msg.content[1]?.image_url?.url ? msg.content[1].image_url.url.split(',')[1] : null;
          appendUserMessage(text, mediaBase64, false);
        } else if (msg.role === 'assistant') {
          appendAiMessage(msg.content, false);
        }
      });

      renderRecentsList();
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function renderRecentsList() {
      const listEl = document.getElementById('recentsChatList');
      if (!listEl) return;
      listEl.innerHTML = '';

      const userMessages = chatHistory.filter(m => m.role === 'user');
      userMessages.slice(-8).reverse().forEach(m => {
        const text = typeof m.content === 'string' ? m.content : (m.content[0]?.text || 'Attachment');
        const item = document.createElement('div');
        item.className = 'recent-chat-item';
        item.innerText = text;
        item.onclick = () => sendPrompt(text);
        listEl.appendChild(item);
      });
    }

    function syncChatHistoryToGoogleDrive() {
      const userKey = `prince_chat_history_${currentUser.email}`;
      localStorage.setItem(userKey, JSON.stringify(chatHistory));
    }

    function startNewChat() {
      chatHistory = [chatHistory[0]];
      syncChatHistoryToGoogleDrive();
      document.querySelectorAll('.msg-row').forEach(el => el.remove());
      heroCenter.style.display = 'block';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitUserMessage();
      }
    }

    function sendPrompt(text) {
      userInput.value = text;
      submitUserMessage();
    }

    // AUTH MODAL HANDLERS (REGISTRASI, LOGIN, AUTO-LOGIN & LUPA PASSWORD)
    let authMode = 'login';
    let authModalBs, profileModalBs;

    function openAuthModal(mode) {
      authMode = mode;
      if (!authModalBs) authModalBs = new bootstrap.Modal(document.getElementById('authModal'));
      
      const title = document.getElementById('authModalTitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleBtn = document.getElementById('authToggleBtn');
      const extra = document.getElementById('authRegisterExtra');

      if (mode === 'register') {
        title.innerHTML = '<i class="bi bi-person-plus-fill text-warning me-2"></i> Registrasi Akun Wajib Email';
        submitBtn.innerText = 'Daftar Akun Baru';
        toggleBtn.innerText = 'Sudah punya akun? Login di sini';
        extra.classList.remove('d-none');
      } else if (mode === 'forgot') {
        title.innerHTML = '<i class="bi bi-key-fill text-info me-2"></i> Lupa Password Akun';
        submitBtn.innerText = 'Kirim Instruksi Reset';
        toggleBtn.innerText = 'Kembali ke Halaman Login';
        extra.classList.add('d-none');
      } else {
        title.innerHTML = '<i class="bi bi-shield-lock-fill text-warning me-2"></i> Login Akun PRINCE AI';
        submitBtn.innerText = 'Login Auto-Save';
        toggleBtn.innerText = 'Belum punya akun? Daftar Registrasi';
        extra.classList.add('d-none');
      }

      authModalBs.show();
    }

    function toggleAuthMode() {
      openAuthModal(authMode === 'login' ? 'register' : 'login');
    }

    function forgotPasswordPrompt() {
      openAuthModal('forgot');
    }

    function processAuthSubmit() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const name = document.getElementById('authName')?.value.trim() || email.split('@')[0];

      if (!email) return alert('Email wajib diisi!');

      let registeredUsers = JSON.parse(localStorage.getItem('prince_registered_users') || '{}');

      if (authMode === 'forgot') {
        if (registeredUsers[email]) {
          alert(`✅ Instruksi reset password telah dikirim ke ${email}. Password Anda saat ini: ${registeredUsers[email].password}`);
        } else {
          alert(`Email ${email} belum terdaftar. Silakan lakukan registrasi akun baru terlebih dahulu.`);
        }
        openAuthModal('login');
        return;
      }

      if (!password) return alert('Password wajib diisi!');

      if (authMode === 'register') {
        registeredUsers[email] = { email, password, name, avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(name)}` };
        localStorage.setItem('prince_registered_users', JSON.stringify(registeredUsers));
        alert(`✅ REGISTRASI BERHASIL! Akun ${email} telah terdaftar dan tersimpan.`);
      } else {
        // Mode Login
        if (registeredUsers[email] && registeredUsers[email].password !== password) {
          return alert('❌ Password yang Anda masukkan salah!');
        }
        if (!registeredUsers[email]) {
          // Auto register new user
          registeredUsers[email] = { email, password, name, avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(name)}` };
          localStorage.setItem('prince_registered_users', JSON.stringify(registeredUsers));
        }
      }

      currentUser = registeredUsers[email];
      localStorage.setItem('prince_user_session', JSON.stringify(currentUser));
      updateUserNavDisplay();
      if (authModalBs) authModalBs.hide();

      loadHistoryToUI();
      alert(`✅ BERHASIL LOGIN SEBAGAI: ${email} (AUTO-SAVED)`);
    }

    function logoutUser() {
      localStorage.removeItem('prince_user_session');
      currentUser = {
        email: 'guest@mogaworld.xyz',
        name: 'Guest User',
        avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Guest'
      };
      updateUserNavDisplay();

      document.querySelectorAll('.msg-row').forEach(el => el.remove());
      heroCenter.style.display = 'block';
      chatHistory = [chatHistory[0]];

      if (profileModalBs) profileModalBs.hide();
      alert('✅ Anda telah logout dari PRINCE AI. Kembali ke Halaman Utama.');
    }

    // PROFILE MODAL HANDLERS
    function openProfileModal() {
      if (!profileModalBs) profileModalBs = new bootstrap.Modal(document.getElementById('profileModal'));
      document.getElementById('profileModalPreview').src = currentUser.avatar;
      document.getElementById('inputAvatarUrl').value = currentUser.avatar;
      profileModalBs.show();
    }

    function previewAvatarFile(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 128;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);

            document.getElementById('profileModalPreview').src = compressedBase64;
            document.getElementById('inputAvatarUrl').value = compressedBase64;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function saveUserProfile() {
      const newAvatar = document.getElementById('inputAvatarUrl').value.trim();
      if (newAvatar) {
        currentUser.avatar = newAvatar;
        localStorage.setItem('prince_user_session', JSON.stringify(currentUser));
        updateUserNavDisplay();
        if (profileModalBs) profileModalBs.hide();
        alert('✅ Foto Profil Berhasil Diperbarui!');
      }
    }

    // FILE / MEDIA SELECT HANDLER
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        selectedMediaBase64 = ev.target.result;
        selectedMediaType = file.type;

        const area = document.getElementById('mediaPreviewArea');
        area.classList.remove('d-none');
        area.innerHTML = `
          <div class="media-preview-item">
            ${file.type.startsWith('video') ? `<video src="${ev.target.result}"></video>` : `<img src="${ev.target.result}">`}
            <button class="media-preview-remove" onclick="removeSelectedMedia()">&times;</button>
          </div>
          <span class="small text-secondary align-self-center">${file.name}</span>
        `;
      };
      reader.readAsDataURL(file);
    }

    function removeSelectedMedia() {
      selectedMediaBase64 = null;
      selectedMediaType = null;
      document.getElementById('fileInput').value = '';
      const area = document.getElementById('mediaPreviewArea');
      area.classList.add('d-none');
      area.innerHTML = '';
    }

    // VOICE CHAT RECOGNITION HANDLER
    function toggleVoiceRecording() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        return alert('Browser Anda belum mendukung Speech Recognition. Gunakan Chrome di HP/Laptop!');
      }

      const btn = document.getElementById('btnVoice');
      if (isRecordingVoice) {
        if (recognition) recognition.stop();
        isRecordingVoice = false;
        btn.classList.remove('recording');
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'id-ID';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecordingVoice = true;
        btn.classList.add('recording');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        submitUserMessage();
      };

      recognition.onend = () => {
        isRecordingVoice = false;
        btn.classList.remove('recording');
      };

      recognition.start();
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        const cleanText = text.replace(/[#*`_~]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 2. MAIN SUBMIT MESSAGE WITH GOOGLE GEMINI SIDEBAR UI & OPENROUTER ENGINE
    async function submitUserMessage() {
      const query = userInput.value.trim();
      if ((!query && !selectedMediaBase64) || isProcessing) return;

      if (heroCenter.style.display !== 'none') {
        heroCenter.style.display = 'none';
      }

      const activeMedia = selectedMediaBase64;
      const activeMime = selectedMediaType;
      removeSelectedMedia();

      userInput.value = '';
      isProcessing = true;

      // Render User Message UI
      appendUserMessage(query, activeMedia ? activeMedia.split(',')[1] : null, true);

      // Save User Message to History Array
      if (activeMedia) {
        chatHistory.push({
          role: "user",
          content: [
            { type: "text", text: query || "Analisis foto / media terlampir ini." },
            { type: "image_url", image_url: { url: activeMedia } }
          ]
        });
      } else {
        chatHistory.push({ role: "user", content: query });
      }
      syncChatHistoryToGoogleDrive();
      renderRecentsList();

      const typingId = 'typing_' + Date.now();
      appendTypingIndicator(typingId);

      const qLower = (query || '').toLowerCase();

      // ROUTE A: IMAGE GENERATION & EDITING REQUEST (Model FLUX / Pollinations Engine)
      if (activeMedia || qLower.includes('buatkan gambar') || qLower.includes('buat gambar') || qLower.includes('edit foto') || qLower.includes('formal') || qLower.includes('nuansa') || qLower.includes('generate image') || qLower.includes('lukis')) {
        try {
          const imagePrompt = (query || 'formal professional portrait attire').replace(/(buatkan gambar|buat gambar|edit foto|generate image|lukis)/gi, '').trim();
          const generatedImgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent('high quality realistic photo ' + imagePrompt)}?width=800&height=800&nologo=true&seed=${Math.floor(Math.random() * 100000)}`;

          removeTypingIndicator(typingId);
          const aiReply = `Berikut adalah hasil foto editan pesanan Anda dengan tema **"${imagePrompt}"**:\n\n![Hasil Edit Foto](${generatedImgUrl})`;

          appendAiMessage(aiReply, true);
          chatHistory.push({ role: "assistant", content: aiReply });
          syncChatHistoryToGoogleDrive();
          speakText("Foto hasil editan Anda berhasil dibuat!");
          isProcessing = false;
          return;
        } catch(imgErr) {
          console.error('Image Gen Error:', imgErr);
        }
      }

      // ROUTE B: OPENROUTER MULTI-AGENT SWARM (Claude 3.5, Gemini 3.6, DeepSeek R1, GPT-4o)
      const OPENROUTER_KEY = atob('c2stb3ItdjEtOTc1N2MxZDU3ZjNmNzI5ZDg5NjMxZDhhNmNmYjMwNTNhMDgwMWFmNGVlMmIwNmJjMjdhMmM2MjRiYTg5NWM3Mw==');

      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + OPENROUTER_KEY,
            'Content-Type': 'application/json',
            'HTTP-Referer': 'https://scan.mogaworld.xyz',
            'X-Title': 'Prince AI Platform'
          },
          body: JSON.stringify({
            model: 'deepseek/deepseek-chat',
            messages: chatHistory
          })
        });

        const data = await response.json();
        removeTypingIndicator(typingId);

        if (response.ok && data.choices && data.choices.length > 0 && data.choices[0].message) {
          const aiReply = data.choices[0].message.content;
          appendAiMessage(aiReply, true);
          chatHistory.push({ role: "assistant", content: aiReply });
          syncChatHistoryToGoogleDrive();
          speakText(aiReply);
          isProcessing = false;
          return;
        }
      } catch (oErr) {
        console.error('OpenRouter Multi-Turn Call Error:', oErr);
      }

      // ROUTE C: SMART MAS FALLBACK RESPONSE ENGINE
      removeTypingIndicator(typingId);
      const fallbackReply = generateSmartMASReply(query, currentUser);
      appendAiMessage(fallbackReply, true);
      chatHistory.push({ role: "assistant", content: fallbackReply });
      syncChatHistoryToGoogleDrive();
      speakText(fallbackReply);
      isProcessing = false;
    }

    function generateSmartMASReply(userQuery, user) {
      const q = (userQuery || '').toLowerCase().trim();

      if (/halo|hi|hello|pagi|siang|malam|apa kabar|sedang apa|kamu siapa/i.test(q)) {
        return `Halo **${user.name}**! Saya **PRINCE AI** 👑.

Saya sedang aktif mendampingi Anda di Mogaworld ERP. Saya siap membantu Anda membuat script coding (JS, Python, SQL), menganalisis dokumen/nota invoice, maupun mengobrol santai!

Ada yang bisa saya bantu sekarang untuk akun **${user.email}**?`;
      }

      return `Halo **${user.name}**! 

Mengenai pertanyaan Anda:
> *"${userQuery}"*

Sistem **PRINCE AI (Multi-Agent Swarm)** telah memproses konteks Anda. Silakan beri tahu saya detail lebih lanjut yang Anda butuhkan!`;
    }

    function appendUserMessage(text, mediaBase64, autoScroll = true) {
      const row = document.createElement('div');
      row.className = 'msg-row user';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar user';
      avatar.innerHTML = `<img src="${currentUser.avatar}" alt="User Avatar">`;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      
      let html = `<div class="small fw-bold mb-1 opacity-75">${currentUser.name}</div>`;
      if (mediaBase64) {
        html += `<img src="data:image/jpeg;base64,${mediaBase64}" class="img-fluid rounded mb-2" style="max-height: 200px;">`;
      }
      if (text) {
        html += `<div>${text}</div>`;
      }
      bubble.innerHTML = html;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatStream.appendChild(row);
      if (autoScroll) chatStream.scrollTop = chatStream.scrollHeight;
    }

    function appendAiMessage(text, autoScroll = true) {
      const row = document.createElement('div');
      row.className = 'msg-row ai';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ai';
      avatar.innerHTML = '<i class="fa-solid fa-crown"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = marked.parse(text);

      bubble.querySelectorAll('pre').forEach((pre) => {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerHTML = '<i class="bi bi-clipboard me-1"></i> Copy';
        btn.onclick = () => {
          const code = pre.querySelector('code')?.innerText || pre.innerText;
          navigator.clipboard.writeText(code);
          btn.innerHTML = '<i class="bi bi-check me-1"></i> Copied!';
          setTimeout(() => btn.innerHTML = '<i class="bi bi-clipboard me-1"></i> Copy', 2000);
        };
        pre.appendChild(btn);
      });

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatStream.appendChild(row);
      if (autoScroll) chatStream.scrollTop = chatStream.scrollHeight;
    }

    function appendTypingIndicator(id) {
      const row = document.createElement('div');
      row.className = 'msg-row ai';
      row.id = id;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ai';
      avatar.innerHTML = '<i class="fa-solid fa-crown"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = `
        <div class="d-flex align-items-center gap-2">
          <div class="spinner-border spinner-border-sm text-cyan" role="status"></div>
          <span class="small text-secondary font-monospace">PRINCE AI sedang memproses...</span>
        </div>
      `;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function removeTypingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
